<!--
  TiffinGrab — paste into WordPress HEAD (Elementor → Site Settings → Custom Code,
  or "Insert Headers and Footers", or child-theme header.php).
  Loads Geist (body) + Material Symbols (icons, SUBSET) + Google Ads tag site-wide.

  PERF CHANGES vs old snippet (2026-06):
   1. Geist  wght 100..900  ->  400..700   (only weights the site uses; smaller variable file)
   2. Caveat REMOVED from global  -> load it only on the referral page (see note at bottom)
   3. Material Symbols full font -> icon_names subset (~8KB vs hundreds of KB)
   4. Dropped hardcoded gstatic woff2 preloads (Google rotates those URLs; wrong hash = wasted bytes)

  RISK NOTE on #3: icon_names list below is every Material Symbols glyph found in the
  page source (51 icons). If a NEW icon is added later it renders as its ligature text
  (e.g. the word "home") until you add it to icon_names. Keep this list in sync, or
  drop the &icon_names=... part to fall back to the full font.
-->

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<!-- Geist body font: narrowed weight range, display=optional (no layout shift, fallback if slow) -->
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&amp;display=optional"
  media="print"
  onload="this.media='all'"
/>
<noscript>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&amp;display=optional" />
</noscript>

<!-- Material Symbols: SUBSET to the 51 icons actually used. display=block hides ligature text until loaded -->
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0&amp;icon_names=add,arrow_back,auto_awesome,balance,calendar_month,call,celebration,chat,eco,edit_note,egg_alt,event_available,favorite,fitness_center,flag,flip,grass,grid_view,grocery,group,help,local_dining,local_fire_department,local_shipping,location_on,mail,map,menu_book,monitor_weight,nutrition,pause_circle,person,restaurant,restaurant_menu,route,sanitizer,savings,schedule,self_improvement,skillet,sms,soup_kitchen,spa,star,store,subscriptions,timer,trending_down,verified,workspace_premium&amp;display=block"
